<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Region Image Grabber · Site access</title>
    <style>
      :root { color-scheme: light dark; font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 460px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 16px; opacity: 0.8; }
      button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 0; background: #2563eb; color: #fff; cursor: pointer; }
      #status { margin-top: 16px; font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <h1>Allow downloading from image CDNs</h1>
      <p>
        By default the extension can only fetch images from the site you are on. Many sites serve images from other
        domains (CDNs), which need broader access. The permission is only used to fetch the images you choose to download.
      </p>
      <button id="grant" type="button">Grant access to all sites</button>
      <div id="status" role="status"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
